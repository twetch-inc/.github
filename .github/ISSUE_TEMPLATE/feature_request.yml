name: Feature request
description: Suggest a capability or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Some of our repositories have a `SCOPE.md` listing what the project does
        and what it deliberately never will. Worth a look first — a few of the
        obvious gaps are decisions with reasons attached.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that you can't do today?
      placeholder: I'm building a feed analytics dashboard and there's no way to get interaction counts without fetching every post.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: If you have a rough API shape in mind, sketch it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried instead
      description: Workarounds you're using today, and why they aren't good enough.

  - type: dropdown
    id: scope-check
    attributes:
      label: Have you read SCOPE.md for this repo?
      options:
        - "Yes — this isn't on the deny list"
        - "Yes — it's listed as out of scope for now, and I'd like to make the case"
        - "This repo doesn't have one"
    validations:
      required: true

  - type: checkboxes
    id: offer
    attributes:
      label: Optional
      options:
        - label: I'd be willing to implement this
